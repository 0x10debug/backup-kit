# b2-retention.conf — Retention policy for the Backblaze B2 backend
#
# B2 charges for egress and for Class B/C (small-object metadata) transactions.
# The policy below balances recovery granularity against transaction costs:
# a moderate daily count, weekly/monthly tiers, and a single yearly snapshot
# for long-term/annual compliance. Pruning too aggressively increases churn
# (and thus transaction fees), so we keep a comfortable monthly window.
#
# Apply with: restic forget --keep-daily 7 --keep-weekly 4 \
#                 --keep-monthly 6 --keep-yearly 1 --prune

# ── Retention ────────────────────────────────────────────────────────────────
RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=6
RETENTION_YEARLY=1

# ── Notes ────────────────────────────────────────────────────────────────────
# * 7 daily + 4 weekly + 6 monthly + 1 yearly ≈ 18 snapshots retained.
# * B2 free egress is ~1GB/day (varies by plan tier). Keep restore drills
#   scoped (use --sample in restore-test.sh) if your repo is large.
# * Native b2: mode + restic's dedup keeps Class B/C transactions low.
# * If you enable B2 Object Lock / immutability, restic forget --prune cannot
#   delete locked objects until they expire — set the lock window shorter
#   than your shortest retention tier, or do not use Object Lock with restic.
# * Consider raising --keep-monthly to 12 for cheap long-term retention;
#   B2 storage is inexpensive and dedup means monthly snapshots share data.
