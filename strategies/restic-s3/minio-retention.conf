# minio-retention.conf — Retention policy for a self-hosted MinIO backend
#
# MinIO has no per-GB or egress fees, so the retention policy can be generous
# without cost concerns. The policy below keeps a comfortable history plus a
# yearly snapshot for long-term compliance. Because storage is your own
# hardware, the practical limit is disk space, not a cloud bill — size your
# MinIO volume for at least 2x your deduplicated repo size to allow for
# retained snapshots and prune headroom.
#
# Apply with: restic forget --keep-daily 7 --keep-weekly 4 \
#                 --keep-monthly 6 --keep-yearly 1 --prune

# ── Retention ────────────────────────────────────────────────────────────────
RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=6
RETENTION_YEARLY=1

# ── Notes ────────────────────────────────────────────────────────────────────
# * 7 daily + 4 weekly + 6 monthly + 1 yearly ≈ 18 snapshots retained.
# * No egress cost: run restore drills and `restic check` as often as you like.
# * Enable MinIO bucket versioning for protection against accidental deletes.
# * Monitor disk usage on the MinIO host — prune reclaims space, but MinIO
#   does not auto-grow volumes. Alert before the volume fills.
# * For distributed MinIO (erasure-coded), the effective capacity is
#   (N-K)/N of raw capacity; size accordingly.
