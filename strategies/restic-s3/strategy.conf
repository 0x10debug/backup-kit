# strategy.conf — Restic + S3 backend
# Backup strategy configuration. Copy to .env and fill in credentials.
#
# This file holds non-secret strategy parameters. Secrets belong in .env
# (which is git-ignored and never committed).

# ── Repository ───────────────────────────────────────────────────────────────
# S3-compatible endpoint + bucket. Works with AWS S3, Backblaze B2, MinIO,
# Cloudflare R2, Wasabi, and any S3-compatible storage.
RESTIC_REPOSITORY=s3:s3.amazonaws.com/my-backup-bucket

# ── Retention policy ─────────────────────────────────────────────────────────
# How many snapshots to keep at each granularity. Older snapshots beyond
# these limits are removed by `restic forget --prune`.
RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=6

# ── What to back up ──────────────────────────────────────────────────────────
# Space-separated list of paths. Default covers all app data under /data.
BACKUP_PATHS=/data

# ── Exclusion patterns (optional) ────────────────────────────────────────────
# Uncomment and adjust to skip caches, logs, or other throwaway data.
# EXCLUDE_PATTERN=--exclude=/data/*/cache
# EXCLUDE_PATTERN=--exclude=/data/*/logs
# EXCLUDE_PATTERN=--exclude='*.tmp'
# EXCLUDE_PATTERN=--exclude=node_modules
