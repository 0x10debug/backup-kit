# wasabi-retention.conf — Retention policy for the Wasabi backend
#
# Wasabi has a 90-day minimum storage duration per object. Snapshots pruned
# before 90 days still incur the remaining storage charge, so the retention
# policy below errs toward keeping a longer daily history and adds a yearly
# snapshot for long-term compliance. This avoids paying for storage you then
# immediately delete.
#
# Apply with: restic forget --keep-daily 7 --keep-weekly 4 \
#                 --keep-monthly 6 --keep-yearly 1 --prune

# ── Retention ────────────────────────────────────────────────────────────────
RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=6
RETENTION_YEARLY=1

# ── Notes ────────────────────────────────────────────────────────────────────
# * 7 daily + 4 weekly + 6 monthly + 1 yearly ≈ 18 snapshots retained.
# * With Wasabi's no-egress model, running `restic check` or restore drills
#   frequently is cheap — do it weekly.
# * The 90-day minimum only affects objects deleted early; snapshots kept
#   longer than 90 days have no penalty. The monthly/yearly tiers comfortably
#   exceed 90 days, so the only churn risk is the daily tier if you lower it.
# * Consider --keep-daily 14 if you want a buffer against the 90-day window.
