# strategy.conf — Borgmatic (YAML declarative configuration)
# This file IS a borgmatic config. Copy it to /etc/borgmatic/config.yaml
# (or ~/.config/borgmatic/config.yaml) and adjust the values.
#
# Borgmatic wraps Borg backup with a clean YAML config. See:
#   https://borgmatic.readthedocs.io/

location:
    # Paths to back up (space-separated list)
    source_directories:
        - /data

    # Borg repository location
    repositories:
        - path: ${BORG_REPO}
          label: mb-backup

    # Optional exclusions
    # exclude_patterns:
    #     - /data/*/cache
    #     - /data/*/logs
    #     - '*.tmp'

storage:
    # Encryption passphrase (read from environment)
    encryption_passphrase: ${BORG_PASSPHRASE}

    # Archive naming with timestamp and hostname
    archive_name_format: '{hostname}-{now:%Y-%m-%d-%H%M%S}'

    # Compression: lz4 is fast; zstd offers better ratio
    compression: zstd,3

    # Retain repository integrity checks
    relocation: false

retention:
    # Keep snapshots per granularity
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6

    # Prefix to match only archives created by this config
    prefix: '{hostname}-'

hooks:
    # Run before backup
    before_backup:
        - echo "Starting borgmatic backup at $(date)"

    # Run after successful backup
    after_backup:
        - echo "borgmatic backup completed at $(date)"

    # Alert on failure (example: send a webhook)
    on_error:
        - echo "borgmatic backup FAILED at $(date)" >&2

consistency:
    # Verify repository integrity on each run
    checks:
        - name: repository
          frequency: 1 week
        - name: archives
          frequency: 1 month
