# strategy.conf — Kopia + S3 backend
# Kopia provides deduplicated, encrypted backups with an optional Web GUI.
# This strategy backs up BACKUP_PATHS to an S3-compatible repository.

# ── Repository ───────────────────────────────────────────────────────────────
# Kopia repository name (connects via AWS S3 credentials in .env).
KOPIA_REPOSITORY=s3-bucket

# ── Retention policy ─────────────────────────────────────────────────────────
# Kopia keeps snapshots by count and age. Adjust to match your needs.
RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=6

# ── What to back up ──────────────────────────────────────────────────────────
BACKUP_PATHS=/data

# ── Exclusion patterns (optional) ────────────────────────────────────────────
# KOPIA_EXCLUDE=--exclude=*.tmp --exclude=*/cache/*
