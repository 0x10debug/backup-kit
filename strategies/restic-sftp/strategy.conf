# strategy.conf — Restic + SFTP backend
# Use another VPS (or any SSH-accessible host) as the backup storage backend.
# Requires passwordless SSH key auth to the remote host (recommended), or
# an SFTP password set in .env.

# ── Repository ───────────────────────────────────────────────────────────────
# Format: sftp:user@host:/absolute/path/to/repo
RESTIC_REPOSITORY=sftp:user@host:/path/to/repo

# ── Retention policy ─────────────────────────────────────────────────────────
RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=6

# ── What to back up ──────────────────────────────────────────────────────────
BACKUP_PATHS=/data

# ── Exclusion patterns (optional) ────────────────────────────────────────────
# EXCLUDE_PATTERN=--exclude=/data/*/cache
# EXCLUDE_PATTERN=--exclude=/data/*/logs
# EXCLUDE_PATTERN=--exclude='*.tmp'
